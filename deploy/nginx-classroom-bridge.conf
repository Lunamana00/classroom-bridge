limit_req_zone $binary_remote_addr zone=classroom_registration:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=classroom_oauth:1m rate=60r/m;
server {
    listen 80;
    listen [::]:80;
    server_name canigetbus.app;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://canigetbus.app$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name canigetbus.app;
    ssl_certificate /etc/letsencrypt/live/canigetbus.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canigetbus.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 12m;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /register {
        limit_req zone=classroom_registration burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host canigetbus.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ~ ^/(token|authorize|revoke|oauth/consent)$ {
        limit_req zone=classroom_oauth burst=15 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host canigetbus.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host canigetbus.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}
