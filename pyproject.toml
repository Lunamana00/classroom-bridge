[project]
name = "classroom-bridge"
version = "0.1.0"
description = "Course-grounded MCP tools with OpenAI API evidence selection and instructor insights"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "mcp>=1.20,<2",
  "httpx>=0.28,<1",
  "openai>=3.41,<4",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
  "fonttools>=4,<5",
  "python-dotenv>=1,<2",
  "Authlib>=1.6,<2",
  "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["classroom*"]

[tool.setuptools.package-data]
classroom = ["static/*"]
